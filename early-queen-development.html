<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f3ee">
  <title>Early Queen Development · Chess Trap Lab</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f4f3ee;
      --ink: #202923;
      --muted: #737b73;
      --green: #315d43;
      --line: #dcded5;
      --card: #fffefa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .app {
      width: 100%;
      max-width: 520px;
      min-height: 100svh;
      margin: 0 auto;
      padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 16px);
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }
    .mark {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 11px;
      background: var(--green);
      color: var(--card);
      font-family: Georgia, serif;
      font-size: 26px;
      line-height: 1;
    }
    .brand { font-size: 17px; font-weight: 750; letter-spacing: -.45px; }
    .back {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      align-self: flex-start;
      margin: 13px 0 18px;
      color: var(--green);
      text-decoration: none;
      font-size: 14px;
      font-weight: 650;
    }
    .back:focus-visible { outline: 3px solid #86a68e; outline-offset: 4px; }
    .kicker {
      margin: 0 0 12px;
      color: var(--green);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: 1.7px;
      text-transform: uppercase;
    }
    h1 {
      max-width: 420px;
      margin: 0;
      font-size: clamp(34px, 9vw, 45px);
      line-height: 1.07;
      letter-spacing: -1.8px;
      font-weight: 760;
    }
    .translation { margin: 12px 0 0; color: var(--muted); font-size: 15px; }
    .queen {
      display: grid;
      place-items: center;
      width: 82px;
      height: 88px;
      margin: 30px 0 31px;
      border-radius: 17px;
      background: #e8ece2;
      color: var(--green);
      font-family: Georgia, serif;
      font-size: 57px;
    }
    .rule { height: 1px; background: var(--line); margin-bottom: 22px; }
    h2 { margin: 0 0 9px; font-size: 19px; letter-spacing: -.4px; }
    .description { max-width: 390px; margin: 0; color: #586159; font-size: 15px; line-height: 1.7; }
    .bottom { flex: 1; min-height: 12px; }
    footer {
      padding-top: 10px;
      border-top: 1px solid var(--line);
      color: #8a9088;
      font-size: 11px;
      letter-spacing: .25px;
    }

    .board-section { margin: 0 0 30px; }
    .board-heading {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 12px;
    }
    .board-heading h2 { margin: 0; }
    .turn-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 650;
      letter-spacing: .35px;
      white-space: nowrap;
    }
    .board-frame {
      padding: 8px;
      border: 1px solid #d8d8cc;
      border-radius: 13px;
      background: #e9e7dd;
      box-shadow: 0 5px 16px rgba(32, 41, 35, .07);
    }
    .chessboard {
      display: grid !important;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      grid-template-rows: repeat(8, minmax(0, 1fr));
      width: 100%;
      aspect-ratio: 1;
      overflow: hidden;
      border-radius: 5px;
      background: #f0eadb;
    }
    .square {
      position: relative;
      min-height: 0;
      display: grid;
      place-items: center;
      min-width: 0;
      aspect-ratio: 1;
      font-family: "Apple Symbols", "Segoe UI Symbol", "Noto Sans Symbols 2", serif;
      font-size: clamp(25px, 8.1vw, 43px);
      line-height: 1;
      user-select: none;
    }
    .square.light { background: #f0eadb; }
    .square.dark { background: #82977d; }
    .piece-white {
      color: #fffefa;
      -webkit-text-fill-color: #fffefa;
      -webkit-text-stroke: .65px #343a32;
      text-shadow: 0 1px 1px rgba(0,0,0,.28);
    }
    .piece-black {
      color: #28332b;
      text-shadow: 0 1px 0 rgba(255,255,255,.15);
    }
    .coord {
      position: absolute;
      left: 3px;
      bottom: 1px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 9px;
      line-height: 1;
      font-weight: 750;
      opacity: .82;
    }
    .light .coord { color: #82977d; }
    .dark .coord { color: #f0eadb; }
    .board-caption {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin: 9px 2px 0;
      color: var(--muted);
      font-size: 11px;
    }
    .board-caption span:last-child { text-align: right; }
    .lesson { margin: 0; }
    .lesson-intro { color: var(--muted); font-size: 13px; line-height: 1.45; margin: 0 0 11px; }
    .line-tabs { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 7px; margin: 0 0 10px; }
    .line-tab { border: 1px solid var(--line); border-radius: 11px; background: var(--card); padding: 10px 5px; font: 700 12px/1.3 inherit; font-family: inherit; color: var(--ink); cursor: pointer; }
    .line-tab[aria-selected="true"] { background: var(--green); border-color: var(--green); color: white; }
    .lesson-panel { border: 1px solid var(--line); background: var(--card); border-radius: 16px; padding: 19px 17px; }
    .lesson-panel h3 { margin: 0 0 7px; font-size: 20px; letter-spacing: -.5px; }
    .lesson-panel p { margin: 0 0 14px; color: #586159; font-size: 14px; line-height: 1.65; }
    .move-row { padding: 11px 0; border-top: 1px solid var(--line); }
    .move-row strong { display: block; font-size: 14px; color: var(--green); margin-bottom: 4px; }
    .move-row span { display: block; font-size: 13px; color: #586159; line-height: 1.55; }
    .branch-title { font-weight: 750; font-size: 15px; margin: 17px 0 5px; }
    .verification { margin-top: 15px !important; padding: 11px 12px; background: #f3f1e8; border-radius: 10px; font-size: 12px !important; }

    .trainer { padding: 12px 10px; }
    .trainer-top { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
    .trainer-label { color:var(--green); font-size:10px; font-weight:800; letter-spacing:1.4px; }
    .trainer-top h3 { margin-top:5px; }
    .reset-btn,.secondary-btn,.branch-btn { border:1px solid var(--line); border-radius:10px; background:#fffefa; color:var(--ink); padding:9px 10px; font:650 12px/1.3 inherit; font-family:inherit; cursor:pointer; }
    .reset-btn { flex-shrink:0; }
    .trainer-frame { margin-top:9px; padding:4px; }
    .training-board { position:relative; display:grid; grid-template-columns:repeat(8,minmax(0,1fr)); width:100%; aspect-ratio:1; overflow:hidden; border-radius:5px; }
    .moving-piece { position:absolute; z-index:5; display:grid; place-items:center; width:12.5%; height:12.5%; pointer-events:none; font-family:"Apple Symbols", "Segoe UI Symbol", "Noto Sans Symbols 2", serif; font-weight:normal; transition:left .48s cubic-bezier(.2,.75,.25,1), top .48s cubic-bezier(.2,.75,.25,1); font-size:clamp(25px,8.1vw,43px); line-height:1; }
    .training-square { position:relative; min-width:0; min-height:0; aspect-ratio:1; border:0; margin:0; padding:0; display:grid; place-items:center; font-family: "Apple Symbols", "Segoe UI Symbol", "Noto Sans Symbols 2", serif; font-size:clamp(25px,8.1vw,43px); line-height:1; cursor:pointer; user-select:none; }
    .sq-light { background:#f0eadb; } .sq-dark { background:#82977d; }
    .training-square.sq-selected { box-shadow:inset 0 0 0 4px #e5b94b; }
    .training-square.sq-legal::after { content:""; position:absolute; width:24%; height:24%; border-radius:50%; background:#24372b66; }
    .training-square:focus-visible { outline:3px solid #d29d27; outline-offset:-3px; z-index:2; }
    .board-coord { position:absolute; left:3px; top:2px; font:750 9px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#536650; }
    .sq-dark .board-coord { color:#f0eadb; }
    .file-coord { top:auto; bottom:2px; left:auto; right:3px; transform:none; }
    .training-square .board-coord:not(.file-coord) { top:2px; left:3px; transform:none; }
    .training-square .board-coord { pointer-events:none; z-index:1; }
    .trainer-status { margin:9px 2px 5px; color:var(--green); font-size:13px; font-weight:750; }
    .move-history { margin:0 2px; color:var(--muted); font-size:11px; line-height:1.6; overflow-wrap:anywhere; }
    .trainer-bottom { display:flex; gap:8px; margin-top:9px; }
    .trainer-bottom button { flex:1; }
    .branch-choices { display:flex; flex-wrap:wrap; gap:8px; margin-top:13px; }
    .branch-prompt { flex-basis:100%; margin:0 !important; font-weight:700; color:var(--ink) !important; }
    .branch-btn { flex:1; min-width:120px; background:#e8ece2; border-color:#d2d9cc; color:var(--green); }
    .verification { margin-bottom:0 !important; }


    .visually-hidden { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    .back, .kicker, .lesson-intro, #trainerHint, #moveHistory, #trainerFeedback, footer { display:none !important; }
    .app { max-width: 560px; padding-top: calc(env(safe-area-inset-top) + 8px); }
    header { padding-bottom: 8px; }
    .lesson { margin-top: 8px; }
    .line-tabs { margin-bottom: 7px; }
    .lesson-panel { padding: 10px 7px; }
    .trainer-top { align-items:center; }
    .trainer-top h3 { font-size: 16px; margin: 2px 0 0; }
    .trainer-label { display:none; }
    .trainer-frame { display:flex; align-items:stretch; gap:7px; padding:4px; margin-top:7px; }
    .training-board { flex:1; width:auto; min-width:0; aspect-ratio:1; }
    .eval-column { width:12px; flex:0 0 12px; display:flex; flex-direction:column; align-items:stretch; gap:0; }
    .eval-top,.eval-bottom,.eval-center { display:none; }
    .eval-track { position:relative; flex:1; min-height:160px; overflow:hidden; border:1px solid #b9bcb2; border-radius:4px; background:#28332b; }
    .eval-white-fill { position:absolute; inset:0 0 auto; height:50%; background:#fffefa; transition:height .25s ease; }
    .eval-black-fill { position:absolute; inset:auto 0 0; height:50%; background:#28332b; transition:height .25s ease; }
    .trainer-status { margin:7px 2px 0; font-size:12px; }
    .trainer-bottom { margin-top:7px; }
    .trainer-bottom button { padding:8px 7px; }
    @media (max-width:380px) { .eval-column { width:10px; flex-basis:10px; } }

    @media (min-width: 480px) {
      .square { font-size: 43px; }
    }

    @media (min-width: 600px) {
      body { padding: 24px 0; }
      .app { min-height: calc(100svh - 48px); border: 1px solid var(--line); border-radius: 22px; padding: 28px 25px 22px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="mark" aria-hidden="true">♞</div>
      <div class="brand">Chess Trap Lab</div>
    </header>

    <section class="lesson" aria-labelledby="lessonTitle">
      <h2 id="lessonTitle" class="visually-hidden">Schachtraining</h2>
      <div class="line-tabs" role="tablist" aria-label="Trainingslinie auswählen">
        <button class="line-tab" type="button" role="tab" aria-selected="true" data-line="0">1 · Tempo</button>
        <button class="line-tab" type="button" role="tab" aria-selected="false" data-line="1">2 · Mattabwehr</button>
        <button class="line-tab" type="button" role="tab" aria-selected="false" data-line="2">3 · Gabel</button>
      </div>
      <div class="lesson-panel trainer" id="lessonPanel" role="tabpanel" aria-live="polite">
        <div class="trainer-top">
          <div><span class="trainer-label" id="trainerStep">AUFGABE 1</span><h3 id="trainerTitle">Greif die Dame mit Tempo an.</h3></div>
          <button class="reset-btn" id="resetTraining" type="button">Neu starten ↻</button>
        </div>
        <p id="trainerHint">Entwickle eine Figur und greife dabei die weiße Dame an.</p>
        <div class="board-frame trainer-frame">
          <div class="eval-column" aria-label="Stockfish-Bewertung">
            <div class="eval-top" id="evalWhite">+0.0</div>
            <div class="eval-track"><div class="eval-white-fill" id="evalWhiteFill"></div><div class="eval-black-fill" id="evalBlackFill"></div><div class="eval-center" id="evalCenter">…</div></div>
            <div class="eval-bottom" id="evalBlack">−0.0</div>
          </div>
          <div id="trainingBoard" class="training-board black-bottom" role="group" aria-label="Interaktives Schachbrett, Schwarz unten"></div>
        </div>
        <div class="trainer-status" id="trainerStatus" role="status">Schwarz am Zug</div>
        <div class="move-history" id="moveHistory" hidden></div>
        <div class="branch-choices" id="branchChoices" hidden></div>
        <div class="trainer-bottom"><button class="secondary-btn" id="showHint" type="button">Tipp anzeigen</button><button class="secondary-btn" id="showSolution" type="button">Zug aufdecken</button></div>
        <p class="verification" id="trainerFeedback" hidden></p>
      </div>
    </section>
    
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script>
    const trainingLines = [
      {
        title: "Gaining Tempo",
        setup: ["e4", "e5", "Qh5"],
        startLabel: "1. e4 e5 2. Qh5",
        steps: [
          {from:"b8",to:"c6",san:"Nc6",hint:"Entwickle einen Springer und sichere gleichzeitig den Bauern e5.",goal:"…Nc6 entwickelt den Springer und verteidigt e5.",reply:"Nc3",replyLabel:"3. Nc3"},
          {from:"g8",to:"f6",san:"Nf6",hint:"Finde einen Entwicklungszug, der die weiße Dame auf h5 direkt angreift.",goal:"…Nf6 entwickelt den zweiten Springer und greift die Dame an.",reply:"Qh3",replyLabel:"3…Nf6 4. Qh3"},
          {from:"d7",to:"d5",san:"d5",hint:"Greife die Dame erneut an – diesmal mit einem Bauernzug, der auch eine Läuferdiagonale öffnet.",goal:"…d5 öffnet die Diagonale des Läufers c8 nach h3 und setzt die Dame erneut unter Druck.",reply:"Qf3",replyLabel:"4…d5 5. Qf3"},
          {from:"c8",to:"g4",san:"Bg4",hint:"Entwickle den Läufer mit Tempo: Welcher Zug greift die Dame auf f3 an?",goal:"…Bg4 entwickelt den Läufer und greift die Dame auf f3 an.",reply:null}
        ]
      },
      {
        title: "Mattabwehr",
        setup: ["e4","e5","Qh5"],
        startLabel: "1. e4 e5 2. Qh5",
        steps: [
          {from:"b8",to:"c6",san:"Nc6",hint:"Entwickle den Springer und verteidige den Bauern e5 gegen die weiße Dame.",goal:"…Nc6 entwickelt den Springer und deckt e5 ab.",reply:"Bc4",replyLabel:"3. Bc4"},
          {from:"g7",to:"g6",san:"g6",hint:"Die weiße Dame und der Läufer zielen auf f7. Finde einen Bauernzug, der die Dame vertreibt und die Diagonale stört.",goal:"…g6 greift die Dame an und zwingt sie, ihre Position zu ändern.",reply:"Qf3",replyLabel:"4. Qf3"},
          {from:"g8",to:"f6",san:"Nf6",hint:"Entwickle den zweiten Springer und greife die Dame auf f3 an.",goal:"…Nf6 entwickelt den Springer und gewinnt ein Tempo gegen die Dame.",reply:"Qb3",replyLabel:"5. Qb3"},
          {from:"d8",to:"e7",san:"Qe7",hint:"Finde einen Zug, der den Bauern f7 zusätzlich verteidigt und die Mattdrohung entschärft.",goal:"…Qe7 verteidigt f7 und entschärft die Mattdrohung. Damit ist die Aufgabe geschafft.",reply:null}
        ]
      },
      {
        title: "Springergabel",
        setup: ["e4","e5","Qh5"],
        startLabel: "1. e4 e5 2. Qh5",
        steps: [
          {from:"g8",to:"f6",san:"Nf6",hint:"Entwickle den Springer und greife die Dame auf h5 an.",goal:"…Nf6 greift die Dame mit Tempo an.",reply:"Qxe5+"},
          {from:"f8",to:"e7",san:"Be7",hint:"Blockiere das Schachgebot mit dem Läufer.",goal:"…Be7 wehrt das Schach ab.",reply:"d3"},
          {from:"b8",to:"c6",san:"Nc6",hint:"Entwickle den zweiten Springer und greife die Dame auf e5 an.",goal:"…Nc6 greift die Dame an.",reply:"Qg3"},
          {from:"c6",to:"d4",san:"Nd4",hint:"Springe ins Zentrum und drohe mit einer Gabel auf c2.",goal:"…Nd4 droht mit …Nxc2+.",branchAfter:true}
        ]
      }
    ];
    const files = "abcdefgh";
    const symbols = {wk:"♚",wq:"♛",wr:"♜",wb:"♝",wn:"♞",wp:"♟",bk:"♚",bq:"♛",br:"♜",bb:"♝",bn:"♞",bp:"♟"};
    let game, lineIndex = 0, stepIndex = 0, selected = null, revealed = false, finished = false, moveLog = [], branchStep = null, opponentThinking = false, opponentTimer = null;
    const boardEl = document.getElementById("trainingBoard");
    const evalWhiteEl = document.getElementById("evalWhite");
    const evalBlackEl = document.getElementById("evalBlack");
    const evalCenterEl = document.getElementById("evalCenter");
    const evalWhiteFill = document.getElementById("evalWhiteFill");
    const evalBlackFill = document.getElementById("evalBlackFill");
    let engineWorker = null, engineReady = false, engineLoadReported = false, engineReadyTimer = null, engineSearchTimer = null, pendingEvalFen = null, engineActiveFen = null, engineActiveTurn = "w", engineSearching = false;
    function showEngineError(message) {
      engineReady = false;
      engineSearching = false;
      if (engineReadyTimer) { clearTimeout(engineReadyTimer); engineReadyTimer = null; }
      if (engineSearchTimer) { clearTimeout(engineSearchTimer); engineSearchTimer = null; }
      let detail = String(message || "Keine weitere Fehlermeldung verfügbar.").trim();
      try {
        const parsed = JSON.parse(detail);
        detail = [
          "Phase: " + (parsed.phase || "unbekannt"),
          "Fehlertyp: " + (parsed.name || "unbekannt"),
          "Meldung: " + (parsed.message || "keine"),
          parsed.stack ? "Stack: " + parsed.stack : "",
          parsed.url ? "Datei: " + parsed.url : "",
          parsed.worker ? "Worker: " + parsed.worker : ""
        ].filter(Boolean).join("\\n");
      } catch (_) {}
      const diagnostics = [
        "Stockfish-Diagnose",
        detail,
        "Seite: " + location.href,
        "Browser: " + navigator.userAgent
      ].join("\\n");
      evalCenterEl.textContent = "Fehler";
      evalWhiteEl.textContent = "—";
      evalBlackEl.textContent = "—";
      evalCenterEl.title = diagnostics;
      const status = document.getElementById("trainerStatus");
      if (status) {
        status.style.whiteSpace = "pre-wrap";
        status.style.overflowWrap = "anywhere";
        status.style.color = "#b42318";
        status.textContent = diagnostics;
      }
      console.error("Stockfish engine diagnostics:", diagnostics);
    }
    function initStockfish() {
      evalCenterEl.textContent = "Lädt";
      evalWhiteEl.textContent = "…";
      evalBlackEl.textContent = "…";
      try {
        // Use the JS-only build first: this avoids separate WASM downloads and locateFile issues.
        // Load a same-origin worker file; blob workers can fail when importing a cross-origin script on mobile Safari.
        engineWorker = new Worker("stockfish-loader.js");
        engineWorker.onmessage = event => {
          const lines = String(event.data || "").split(/\r?\n/).map(line => line.trim()).filter(Boolean);
          for (const line of lines) {
            if (line.startsWith("ENGINE_LOAD_ERROR:")) { showEngineError(line.slice("ENGINE_LOAD_ERROR:".length)); continue; }
            if (line.startsWith("ENGINE_LOAD_OK:")) {
              engineLoadReported = true;
              if (engineReadyTimer) clearTimeout(engineReadyTimer);
              engineReadyTimer = setTimeout(() => {
                if (!engineReady) showEngineError(JSON.stringify({
                  phase: "UCI-Handshake",
                  name: "Timeout",
                  message: "Stockfish-Datei wurde geladen, aber die Engine hat nicht rechtzeitig mit uciok geantwortet.",
                  worker: "stockfish-loader.js",
                  loaded: true,
                  seconds: 30
                }));
              }, 30000);
              evalCenterEl.textContent = "Startet";
              evalCenterEl.title = "Stockfish-Datei geladen; warte auf UCI-Antwort.";
              engineWorker.postMessage("uci");
              continue;
            }
            if (line === "uciok") { engineWorker.postMessage("isready"); continue; }
            if (line === "readyok") {
              engineReady = true;
              if (engineReadyTimer) { clearTimeout(engineReadyTimer); engineReadyTimer = null; }
              evalCenterEl.textContent = "Analyse";
              evalCenterEl.title = "Stockfish ist bereit und analysiert die Stellung.";
              if (pendingEvalFen) startEngineSearch();
              else updateEvaluation();
              continue;
            }
            if (line.startsWith("bestmove")) {
              engineSearching = false;
              if (engineSearchTimer) { clearTimeout(engineSearchTimer); engineSearchTimer = null; }
              if (evalCenterEl.textContent === "Analyse") {
                evalCenterEl.textContent = "Keine Bewertung";
                evalCenterEl.title = "Stockfish hat den Suchzug beendet, aber keinen Bewertungswert geliefert.";
              }
              if (pendingEvalFen && pendingEvalFen !== engineActiveFen) startEngineSearch();
              continue;
            }
            if (!engineSearching || engineActiveFen !== pendingEvalFen) continue;
            const match = line.match(/\bscore (cp|mate) (-?\d+)/);
            if (match) {
              const rawScore = Number(match[2]);
              const mateWhite = match[1] === "mate" ? rawScore * (engineActiveTurn === "b" ? -1 : 1) : null;
              const value = match[1] === "mate" ? (mateWhite > 0 ? 99 : -99) : rawScore / 100 * (engineActiveTurn === "b" ? -1 : 1);
              renderEvaluation(value, mateWhite);
            }
          }
        };
        engineWorker.onerror = event => showEngineError(JSON.stringify({
          phase: "Worker-Fehler",
          name: event.error && event.error.name ? event.error.name : "ErrorEvent",
          message: event.message || event.type || "Unbekannter Worker-Fehler",
          url: event.filename || "keine Datei-URL vom Browser gemeldet",
          line: event.lineno || 0,
          column: event.colno || 0,
          worker: "stockfish-loader.js"
        }));
        engineWorker.onmessageerror = () => showEngineError("Antwort der Engine konnte nicht gelesen werden.");
        // Wait for the loader to confirm that Stockfish has been imported before starting UCI.
      } catch (error) {
        showEngineError(error && error.message ? error.message : String(error));
      }
    }
    function renderEvaluation(whiteScore, mateIn = null) {
      // Keep the bar readable: +3/-3 is a strong advantage, not a forced win.
      // Use a linear scale so it reaches the end only at +/-10 (or a forced mate).
      const bounded = Math.max(-10, Math.min(10, whiteScore));
      const whitePercent = mateIn !== null ? (mateIn > 0 ? 100 : 0) : 50 + bounded * 5;
      evalWhiteFill.style.height = whitePercent + "%";
      evalBlackFill.style.height = (100 - whitePercent) + "%";
      const shown = mateIn !== null ? (mateIn > 0 ? "M" + mateIn : "−M" + Math.abs(mateIn)) : (whiteScore > 0 ? "+" : "") + whiteScore.toFixed(1);
      const blackScore = -whiteScore;
      const blackShown = mateIn !== null ? (mateIn < 0 ? "M" + Math.abs(mateIn) : "−M" + Math.abs(mateIn)) : (blackScore > 0 ? "+" : "−") + Math.abs(blackScore).toFixed(1);
      evalWhiteEl.textContent = shown;
      evalBlackEl.textContent = blackShown;
      evalCenterEl.textContent = shown;
    }
    function startEngineSearch() {
      if (!engineReady || !engineWorker || !pendingEvalFen || engineSearching) return;
      engineActiveFen = pendingEvalFen;
      engineActiveTurn = game ? game.turn() : "w";
      engineSearching = true;
      evalCenterEl.textContent = "Analyse";
      evalCenterEl.title = "Stockfish analysiert bis Tiefe 7.";
      if (engineSearchTimer) clearTimeout(engineSearchTimer);
      engineSearchTimer = setTimeout(() => {
        if (engineSearching) showEngineError(JSON.stringify({
          phase: "Stellungsanalyse",
          name: "Timeout",
          message: "Stockfish hat innerhalb von 25 Sekunden keinen bestmove zurückgegeben.",
          fen: engineActiveFen,
          depth: 7,
          worker: "stockfish-loader.js"
        }));
      }, 25000);
      engineWorker.postMessage("position fen " + engineActiveFen);
      engineWorker.postMessage("go depth 7");
    }
    function updateEvaluation() {
      if (!game) return;
      pendingEvalFen = game.fen();
      if (!engineWorker || !engineReady) return;
      if (engineSearching) {
        engineWorker.postMessage("stop");
        return;
      }
      startEngineSearch();
    }
    const statusEl = document.getElementById("trainerStatus");
    const hintEl = document.getElementById("trainerHint");
    const titleEl = document.getElementById("trainerTitle");
    const stepEl = document.getElementById("trainerStep");
    const historyEl = document.getElementById("moveHistory");
    const feedbackEl = document.getElementById("trainerFeedback");
    const branchEl = document.getElementById("branchChoices");
    const lineNow = () => trainingLines[lineIndex];
    const stepsNow = () => activeSteps;
    let activeSteps = [];
    const stepNow = () => stepsNow()[stepIndex];
    function loadTraining(index) {
      if (opponentTimer) clearTimeout(opponentTimer);
      opponentTimer = null; opponentThinking = false;
      lineIndex = index; activeSteps = [...trainingLines[index].steps]; stepIndex = 0; selected = null; revealed = false; finished = false; branchStep = null; moveLog = [];
      game = new Chess();
      for (const san of lineNow().setup) {
        const result = game.move(san);
        if (!result) { statusEl.textContent = "Diese Trainingsstellung konnte nicht geladen werden."; return; }
      }
      moveLog = [lineNow().startLabel];
      document.querySelectorAll(".line-tab").forEach(tab => tab.setAttribute("aria-selected", String(Number(tab.dataset.line) === index)));
      branchEl.hidden = true; branchEl.replaceChildren();
      renderTrainer();
    }
    function currentOptions() {
      const step = stepNow();
      if (!step) return [];
      return step.choices || [step];
    }
    function renderBoard(animationMove = null) {
      boardEl.replaceChildren();
      const board = game.board();
      const legalFrom = selected ? game.moves({square:selected, verbose:true}).map(m => m.to) : [];
      for (let row=7; row>=0; row--) for (let col=7; col>=0; col--) {
        const sq = files[col] + (8-row), piece = board[row][col];
        const cell = document.createElement("button");
        cell.type = "button"; cell.className = "training-square " + ((row+col)%2===0 ? "sq-light" : "sq-dark");
        cell.dataset.square = sq;
        cell.setAttribute("aria-label", sq + (piece ? " " + (piece.color === "w" ? "weiße " : "schwarze ") + piece.type : ""));
        if (selected === sq) cell.classList.add("sq-selected");
        if (legalFrom.includes(sq)) cell.classList.add("sq-legal");
        if (piece) { const glyph = document.createElement("span"); glyph.className = piece.color === "w" ? "piece-white" : "piece-black"; glyph.textContent = symbols[piece.color + piece.type]; cell.append(glyph); }
        if (col === 7) { const coord = document.createElement("small"); coord.className = "board-coord"; coord.textContent = String(8-row); cell.append(coord); }
        if (row === 0) { const coord = document.createElement("small"); coord.className = "board-coord file-coord"; coord.textContent = files[col]; cell.append(coord); }
        cell.addEventListener("click", () => clickSquare(sq));
        if (animationMove && sq === animationMove.to && piece) {
          const destinationGlyph = cell.querySelector("span.piece-white, span.piece-black");
          if (destinationGlyph) destinationGlyph.style.visibility = "hidden";
        }
        boardEl.append(cell);
      }
      if (animationMove) {
        const fileIndex = square => square.charCodeAt(0) - 97;
        const rankIndex = square => Number(square[1]) - 1;
        const visualX = square => 7 - fileIndex(square);
        const visualY = square => rankIndex(square);
        const destinationGlyph = boardEl.querySelector('[data-square="' + animationMove.to + '"] .piece-white, [data-square="' + animationMove.to + '"] .piece-black');
        if (!destinationGlyph) return;
        const mover = destinationGlyph.cloneNode(true);
        mover.classList.add("moving-piece");
        // The destination glyph is hidden while the overlay moves; don't copy that hidden state.
        mover.style.visibility = "visible";
        const glyphStyle = getComputedStyle(destinationGlyph);
        mover.style.fontFamily = glyphStyle.fontFamily;
        mover.style.fontSize = glyphStyle.fontSize;
        mover.style.fontWeight = glyphStyle.fontWeight;
        mover.style.color = glyphStyle.color;
        mover.style.webkitTextFillColor = glyphStyle.webkitTextFillColor;
        mover.style.webkitTextStroke = glyphStyle.webkitTextStroke;
        mover.style.textShadow = glyphStyle.textShadow;
        mover.style.left = (visualX(animationMove.from) * 12.5) + "%";
        mover.style.top = (visualY(animationMove.from) * 12.5) + "%";
        boardEl.append(mover);
        requestAnimationFrame(() => {
          mover.style.left = (visualX(animationMove.to) * 12.5) + "%";
          mover.style.top = (visualY(animationMove.to) * 12.5) + "%";
        });
        setTimeout(() => {
          mover.remove();
          const target = boardEl.querySelector('[data-square="' + animationMove.to + '"] .piece-white, [data-square="' + animationMove.to + '"] .piece-black');
          if (target) target.style.visibility = "";
        }, 540);
      }
    }
    function renderTrainer(animationMove = null) {
      renderBoard(animationMove);
      updateEvaluation();
      const step = stepNow();
      const isChoice = step && step.choices;
      stepEl.textContent = finished ? "LINIE ABGESCHLOSSEN" : "AUFGABE " + (stepIndex+1) + " / " + stepsNow().length;
      titleEl.textContent = finished ? "Stark gespielt." : lineNow().title;
      hintEl.textContent = finished ? "Du hast diese Trainingslinie durchgespielt. Starte neu oder wähle eine andere Linie." : (revealed ? "Lösung: " + currentOptions().map(o=>o.san).join(" / ") : (step.hint || step.choices[0].hint));
      statusEl.textContent = finished ? "Training abgeschlossen ✓" : "Schwarz am Zug · Wähle eine schwarze Figur.";
      historyEl.textContent = "Stellung: " + moveLog.join(" · ");
      branchEl.hidden = true; branchEl.replaceChildren();
      if (finished) { feedbackEl.textContent = "Linie abgeschlossen. Du kannst sie erneut spielen oder oben eine andere Variante wählen."; return; }
      feedbackEl.textContent = revealed ? currentOptions().map(o=>o.goal).join(" ") : "Finde den Zug selbst. Du kannst „Tipp anzeigen“ drücken, wenn du einen Schubs brauchst.";
      if (branchStep) {
        branchEl.hidden = false;
        const label = document.createElement("p"); label.className = "branch-prompt"; label.textContent = "Wie antwortet Weiß? Wähle eine Fortsetzung:"; branchEl.append(label);
        [{label:"6. Na3",san:"Na3"},{label:"6. Kd1",san:"Kd1"}].forEach(choice => {
          const b = document.createElement("button"); b.type="button"; b.className="branch-btn"; b.textContent=choice.label;
          b.addEventListener("click",()=>playBranch(choice.san)); branchEl.append(b);
        });
      } else if (isChoice && !finished) {
        branchEl.hidden = false;
        step.choices.forEach(choice => {
          const b = document.createElement("button"); b.type="button"; b.className="branch-btn"; b.textContent=choice.label;
          b.addEventListener("click",()=>attemptMove(choice.from,choice.to)); branchEl.append(b);
        });
      }
    }
    function clickSquare(sq) {
      if (finished || branchStep || opponentThinking || game.turn() !== "b") return;
      const piece = game.get(sq);
      if (!selected) { if (piece && piece.color === "b") { selected=sq; renderBoard(); } return; }
      if (piece && piece.color === "b") { selected=sq; renderBoard(); return; }
      attemptMove(selected,sq);
    }
    function attemptMove(from,to) {
      if (finished || opponentThinking) return;
      const step = stepNow(), options = currentOptions();
      const option = options.find(o=>o.from===from && o.to===to);
      if (!option) {
        selected = null; renderBoard();
        statusEl.textContent = "Noch nicht – probier einen anderen Zug. Tipp: " + (step.hint || step.choices[0].hint);
        feedbackEl.textContent = "Der Zug passt nicht zur gesuchten Idee. Du kannst weiterprobieren; es wird kein Zug ausgeführt.";
        return;
      }
      const played = game.move({from,to,promotion:"q"});
      if (!played) { selected=null; renderBoard(); statusEl.textContent="Dieser Zug ist nicht legal."; return; }
      moveLog.push("…" + option.san);
      selected=null; revealed=false;
      feedbackEl.textContent = option.goal;
      if (option.branchAfter) {
        branchStep = false;
        opponentThinking = true;
        renderTrainer();
        statusEl.textContent = "Richtig! …Nd4. Weiß antwortet …";
        feedbackEl.textContent = option.goal;
        opponentTimer = setTimeout(() => {
          opponentThinking = false;
          opponentTimer = null;
          playBranch("Na3");
        }, 2000);
        return;
      }
      if (option.reply) {
        opponentThinking = true;
        renderTrainer();
        statusEl.textContent = "Weiß überlegt …";
        const delay = 2000;
        opponentTimer = setTimeout(() => {
          const legalReply = game.moves({verbose:true}).find(move => move.san === option.reply);
          const animationMove = legalReply ? {from:legalReply.from, to:legalReply.to, piece:{color:legalReply.color, type:legalReply.piece}} : null;
          const reply = game.move(option.reply);
          if (reply) moveLog.push(reply.san);
          opponentThinking = false;
          opponentTimer = null;
          stepIndex++;
          if (stepIndex >= stepsNow().length) finished = true;
          renderTrainer(animationMove);
          if (!finished) statusEl.textContent = "Richtig! Weiß hat gezogen. Jetzt wieder Schwarz.";
        }, delay);
        return;
      }
      stepIndex++;
      if (stepIndex >= stepsNow().length) finished=true;
      renderTrainer();
    }
    function playBranch(san) {
      const legalReply = game.moves({verbose:true}).find(move => move.san === san);
      const animationMove = legalReply ? {from:legalReply.from, to:legalReply.to, piece:{color:legalReply.color, type:legalReply.piece}} : null;
      const whiteMove = game.move(san);
      if (!whiteMove) { statusEl.textContent="Diese Antwort ist in der Stellung nicht legal."; return; }
      branchStep = null;
      moveLog.push(whiteMove.san);
      if (san === "Na3") {
        activeSteps.push(
          {from:"e7",to:"a3",san:"Bxa3",hint:"Der weiße Springer steht auf a3. Welcher Läufer kann ihn schlagen?",goal:"…Bxa3 schlägt den Springer.",reply:"bxa3"},
          {from:"d4",to:"c2",san:"Nxc2+",hint:"Finde die Springergabel mit Schach auf c2.",goal:"…Nxc2+ gibt Schach und greift den Turm a1 an.",reply:null}
        );
      } else {
        activeSteps.push(
          {from:"d7",to:"d5",san:"d5",hint:"Öffne das Zentrum mit einem Bauernzug.",goal:"…d5 setzt das Zentrum unter Druck.",reply:"Qxg7"},
          {from:"h8",to:"g8",san:"Rg8",hint:"Greife die weiße Dame auf g7 mit dem Turm an.",goal:"…Rg8 greift die Dame an.",reply:"Qh6"},
          {from:"d5",to:"e4",san:"dxe4",hint:"Schlage den Bauern auf e4 mit deinem d-Bauern.",goal:"…dxe4 öffnet weitere Linien.",reply:"dxe4"},
          {from:"c8",to:"g4",san:"Bg4+",hint:"Finde das Läuferschach auf der Diagonale c8–g4.",goal:"…Bg4+ setzt den weißen König schach.",reply:null}
        );
      }
      stepIndex++;
      renderTrainer(animationMove);
      statusEl.textContent = "Weiß hat gezogen. Jetzt bist du mit Schwarz dran.";
    }
    document.querySelectorAll(".line-tab").forEach(tab=>tab.addEventListener("click",()=>loadTraining(Number(tab.dataset.line))));
    document.getElementById("resetTraining").addEventListener("click",()=>loadTraining(lineIndex));
    document.getElementById("showHint").addEventListener("click",()=>{
      const step=stepNow(); if (!step || finished) return;
      hintEl.textContent=step.hint || step.choices[0].hint;
      statusEl.textContent="Tipp: Lies die Idee und finde den Zug selbst.";
    });
    document.getElementById("showSolution").addEventListener("click",()=>{
      if (finished) return; revealed=true;
      hintEl.textContent="Lösung: "+currentOptions().map(o=>o.san).join(" / ");
      feedbackEl.textContent=currentOptions().map(o=>o.goal).join(" ");
      statusEl.textContent="Lösung aufgedeckt – du kannst den Zug trotzdem selbst ausführen.";
    });
    initStockfish();
    if (typeof Chess === "undefined") {
      statusEl.textContent="Das Schachmodul konnte nicht geladen werden. Prüfe die Internetverbindung und lade die Seite neu.";
    } else loadTraining(0);
  </script>
</body>
