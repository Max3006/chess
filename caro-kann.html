<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f3ee"><title>Caro-Kann · Eröffnungsbuch</title>
<style>
:root{--paper:#f4f3ee;--ink:#202923;--muted:#737b73;--green:#315d43;--line:#dcded5;--card:#fffefa;--light:#f0eadb;--dark:#82977d}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:650px;margin:auto;padding:calc(env(safe-area-inset-top) + 12px) 15px 40px}header{display:flex;align-items:center;gap:11px;padding-bottom:12px;border-bottom:1px solid var(--line)}.mark{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;background:var(--green);color:white;font:25px Georgia}.brand{font-size:17px;font-weight:750}.back{display:inline-block;margin:14px 0;color:var(--green);text-decoration:none;font-weight:700;font-size:13px}h1{font-size:clamp(30px,8vw,43px);letter-spacing:-1.4px;line-height:1.1;margin:7px 0}.sub{color:var(--muted);line-height:1.6;margin:10px 0 20px}.random-panel{background:#e8ece2;border:1px solid #cdd8c9;border-radius:16px;padding:14px;margin:14px 0 20px}.random-panel h2{font-size:18px;margin:0 0 4px}.random-panel p{font-size:12px;color:var(--muted);margin:0 0 10px}.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 17px}.panel h2{font-size:20px;margin:0 0 4px}.muted{font-size:12px;color:var(--muted)}.tag{display:inline-block;background:#e8ece2;color:var(--green);border-radius:6px;padding:3px 7px;font-size:11px;font-weight:800;margin:7px 0}.boardwrap{padding:7px;border-radius:12px;background:#e9e7dd;border:1px solid #d8d8cc;margin:12px 0 9px}.board{position:relative;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));aspect-ratio:1;overflow:hidden;border-radius:5px}.sq{position:relative;border:0;padding:0;margin:0;min-width:0;aspect-ratio:1;display:grid;place-items:center;font-family:"Apple Symbols","Segoe UI Symbol","Noto Sans Symbols 2",serif;font-size:clamp(27px,8vw,49px);line-height:1;cursor:pointer}.light{background:var(--light)}.dark{background:var(--dark)}.whitepiece{color:#fffefa;-webkit-text-stroke:.7px #343a32;text-shadow:0 1px 1px #0003}.blackpiece{color:#28332b}.selected{box-shadow:inset 0 0 0 4px #e5b94b}.legal:after{content:"";position:absolute;width:22%;height:22%;border-radius:50%;background:#24372b66}.actions{display:flex;gap:8px;margin-top:10px}.btn{flex:1;font:inherit;font-weight:700;border:1px solid var(--line);border-radius:10px;padding:11px 8px;background:var(--card);color:var(--ink);cursor:pointer}.btn.primary{background:var(--green);border-color:var(--green);color:white}.btn:disabled{opacity:.4;cursor:default}.status{font-size:13px;font-weight:700;color:var(--green);margin:9px 0}.notation{font-size:12px;color:var(--muted);overflow-wrap:anywhere;line-height:1.7}.explain{font-size:13px;color:#586159;line-height:1.6;margin:10px 0 0}.counter{font-size:12px;color:var(--muted);font-weight:700}.done{color:#24693b}.tip{margin-top:10px;font-size:13px;color:#586159;line-height:1.5}.tip summary{cursor:pointer;color:var(--green);font-weight:750;list-style:none}.tip summary:before{content:"💡 ";}.tip[open]{background:#f3f1e8;border-radius:10px;padding:10px}.flying-piece{position:absolute;z-index:5;pointer-events:none;display:grid;place-items:center;transition:transform 380ms ease-in-out;font-family:"Apple Symbols","Segoe UI Symbol","Noto Sans Symbols 2",serif;line-height:1}.board.busy .sq{pointer-events:none}
</style></head><body><main class="app"><header><div class="mark">♞</div><div class="brand">Chess Trainer</div></header><a class="back" href="index.html">← Zurück zum Hauptmenü</a><h1>Caro-Kann-Eröffnungen</h1><p class="sub">1. e4 c6 2. d4 d5 ist schon gespielt. Du bist Schwarz – spiele die Variante auf dem Brett zu Ende.</p><section class="random-panel"><h2>🎲 Zufällige Variante</h2><p>Trainiere eine zufällige Caro-Kann-Variante – wie Karteikarten.</p><button class="btn primary" id="randomCard">Zufällige Karte starten ↗</button><div id="randomTarget"></div></section><div id="variations"></div></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script>
const variations=[
{id:"main",name:"Klassische Variante",moves:"1. e4 c6 2. d4 d5 3. Nc3 dxe4 4. Nxe4 Bf5",tag:"Hauptidee",intro:"Der klassische Aufbau zeigt den Grundgedanken der Caro-Kann: erst den c-Bauern zur Unterstützung von ...d5 bewegen, dann das Zentrum herausfordern und den Läufer c8 vor ...e6 entwickeln.",plan:"Nach 3.Nc3 schlägst du mit ...dxe4 den weißen d-Bauern. Nach Nxe4 entwickelst du den Läufer nach f5, bevor du ...e6 spielst. Achte darauf, dass Weiß mit Ng3 den Läufer angreifen kann; ziehe ihn dann meist nach g6 zurück.",line:"1.e4 c6 2.d4 d5 3.Nc3 dxe4 4.Nxe4 Bf5 5.Ng3 Bg6 6.Nf3 Nd7",sequence:["e4","c6","d4","d5","Nc3","dxe4","Nxe4","Bf5","Ng3","Bg6","Nf3","Nd7"],watch:"Nicht automatisch ...e6 vor der Läuferentwicklung spielen – das kann den Läufer c8 einsperren."},
{id:"advance",name:"Vorstoßvariante",moves:"1. e4 c6 2. d4 d5 3. e5 Bf5",tag:"Weiß schließt das Zentrum",intro:"Weiß gewinnt Raum und schiebt den e-Bauern vor. Schwarz sollte den Läufer c8 herausbringen, solange die Diagonale noch offen ist.",plan:"Typischer Plan: ...Bf5, ...e6, ...c5. Mit ...c5 greifst du die weiße Bauernkette an ihrer Basis d4 an. Entwickle Figuren und rochiere, bevor du wild angreifst.",line:"1.e4 c6 2.d4 d5 3.e5 Bf5 4.Nf3 e6 5.Be2 c5 6.O-O Nc6",sequence:["e4","c6","d4","d5","e5","Bf5","Nf3","e6","Be2","c5","O-O","Nc6"],watch:"Spiele nicht gedankenlos ...c5, wenn dadurch ein taktischer Schlag gegen d5 oder b7 möglich ist. Prüfe erst die Stellung."},
{id:"exchange",name:"Abtauschvariante",moves:"1. e4 c6 2. d4 d5 3. exd5 cxd5",tag:"Offenes Zentrum",intro:"Weiß tauscht den e-Bauern gegen deinen d-Bauern. Du nimmst mit dem c-Bauern zurück und erhältst eine symmetrischere Stellung.",plan:"Entwickle ...Nc6, ...Nf6 und den Läufer. Weil die Bauernstruktur ausgeglichener ist, werden Figurenentwicklung, zentrale Felder und ein guter Plan wichtiger als eine sofortige Attacke.",line:"1.e4 c6 2.d4 d5 3.exd5 cxd5 4.Bd3 Nc6 5.c3 Nf6 6.Bf4",sequence:["e4","c6","d4","d5","exd5","cxd5","Bd3","Nc6","c3","Nf6","Bf4"],watch:"Die Stellung ist nicht automatisch remis. Achte auf Entwicklungsvorsprung und mögliche Angriffe am Königsflügel."},
{id:"fantasy",name:"Fantasy-Variante",moves:"1. e4 c6 2. d4 d5 3. f3",tag:"Aggressiver Aufbau",intro:"Weiß unterstützt den Bauern e4 mit f3 und möchte oft mit c4 oder e5 ein starkes Zentrum aufbauen. Das ist die Fantasy-Variante – du musst den Plan aktiv hinterfragen.",plan:"Ein wichtiger Ansatz ist 3...dxe4 4.fxe4 e5: Schwarz schlägt den Bauern und kontert sofort im Zentrum. Es gibt auch andere Ideen, etwa ...Qb6 in passenden Stellungen. Entscheide nicht nur auswendig, sondern prüfe Entwicklung, Königssicherheit und die Bauernstruktur.",line:"1.e4 c6 2.d4 d5 3.f3 dxe4 4.fxe4 e5 5.Nf3 exd4",sequence:["e4","c6","d4","d5","f3","dxe4","fxe4","e5","Nf3","exd4"],watch:"Nach 4.fxe4 e5 greift Schwarz das Zentrum an. Prüfe vor jedem Zug, ob Weiß taktisch auf d5 oder e5 schlagen kann und ob deine Dame sicher steht."},
{id:"two",name:"Zwei-Springer-Variante",moves:"1. e4 c6 2. d4 d5 3. Nc3 dxe4 4. Nxe4 Nf6",tag:"Frühe Figurenentwicklung",intro:"Weiß entwickelt beide Springer, bevor es zum typischen ...Bf5 kommt. Schwarz kann den Springer e4 sofort angreifen.",plan:"Mit ...Nf6 entwickelst du eine Figur und greifst den Springer e4 an. Weiß kann tauschen oder den Springer zurückziehen. Rechne nach jedem Abtausch nach, welche Figur zurücknimmt und welche Bauernstruktur entsteht.",line:"1.e4 c6 2.d4 d5 3.Nc3 dxe4 4.Nxe4 Nf6 5.Nxf6+ exf6",sequence:["e4","c6","d4","d5","Nc3","dxe4","Nxe4","Nf6","Nxf6+","exf6"],watch:"Nach Nxf6+ kannst du oft mit dem e-Bauern zurücknehmen; prüfe aber auch ...gxf6 und die dadurch entstehenden Strukturen."},
{id:"panov",name:"Panow-Angriff",moves:"1. e4 c6 2. d4 d5 3. exd5 cxd5 4. c4",tag:"Isolierter Damenbauer möglich",intro:"Nach dem Abtausch spielt Weiß c4 und greift dein Zentrum an. Es können offene, taktische Stellungen entstehen – weniger ein ruhiger Aufbau als ein Kampf um d4 und d5.",plan:"Entwickle ...Nf6 und ...Nc6, übe Druck auf d4 aus und achte auf mögliche isolierte Bauern. Tausche nicht automatisch alles ab: Figurenaktivität ist hier besonders wichtig.",line:"1.e4 c6 2.d4 d5 3.exd5 cxd5 4.c4 Nf6 5.Nc3 e6",sequence:["e4","c6","d4","d5","exd5","cxd5","c4","Nf6","Nc3","e6"],watch:"Weiß kann mit c4 schnell Raum und offene Linien bekommen. Vermeide unnötige Tempoverluste mit derselben Figur."},
{id:"tandem",name:"Abgelehnte Abtausch-Ideen",moves:"1. e4 c6 2. d4 d5 3. Nd2 dxe4 4. Nxe4 Bf5",tag:"Ruhiger Aufbau",intro:"3.Nd2 schützt den e4-Bauern und vermeidet manche Abtauschvarianten. Schwarz kann trotzdem die zentrale Idee der Caro-Kann umsetzen.",plan:"Nach ...dxe4 und Nxe4 entwickelst du den Läufer nach f5. Spiele danach ...e6, ...Nd7 oder ...Nf6 je nach weißem Aufbau und rochiere.",line:"1.e4 c6 2.d4 d5 3.Nd2 dxe4 4.Nxe4 Bf5 5.Ng3 Bg6",sequence:["e4","c6","d4","d5","Nd2","dxe4","Nxe4","Bf5","Ng3","Bg6"],watch:"Achte darauf, dass die weiße Dame und Springer keine taktischen Drohungen gegen b7 oder e6 bekommen."},
{id:"sidelines",name:"Andere erste Züge",moves:"1. d4 c6 · 1. Nf3 c6 · 1. c4 c6",tag:"Nicht jede Partie wird Caro-Kann",intro:"Caro-Kann ist streng genommen eine Antwort auf 1.e4. Gegen 1.d4, 1.Nf3 oder 1.c4 kann ...c6 zu anderen Eröffnungen überleiten.",plan:"Gegen 1.d4 kannst du nach ...d5 in eine Slawische Verteidigung übergehen; gegen 1.c4 oder 1.Nf3 entscheidet Weiß oft erst später, welche Struktur entsteht. Bleib flexibel und spiel nicht mechanisch ...d5, wenn Weiß etwas anderes vorbereitet.",line:"1.d4 c6 2.c4 d5 (Slawisch möglich)",sequence:["d4","c6","c4","d5"],watch:"Die Eröffnungsbezeichnung hängt von der weiteren Zugfolge ab. ...c6 allein macht eine Stellung noch nicht automatisch zu Caro-Kann."}
];
const moveTips={"main":["Schlage den Bauern auf e4.","Entwickle deinen Läufer nach f5.","Zieh den angegriffenen Läufer zurück.","Entwickle den Springer nach d7."],"advance":["Entwickle den Läufer nach f5.","Stütze d5 mit dem e-Bauern.","Greife den Bauern d4 mit c5 an.","Entwickle den Springer nach c6."],"exchange":["Nimm mit dem c-Bauern zurück.","Entwickle den Springer nach c6.","Entwickle den Springer nach f6."],"fantasy":["Schlage den Bauern auf e4.","Greife das Zentrum mit e5 an.","Schlage den Bauern auf d4."],"two":["Schlage den Bauern auf e4.","Greife den Springer e4 mit Nf6 an.","Nimm mit dem e-Bauern zurück."],"panov":["Nimm mit dem c-Bauern zurück.","Entwickle den Springer nach f6.","Stütze d5 mit e6."],"tandem":["Schlage den Bauern auf e4.","Entwickle den Läufer nach f5.","Zieh den Läufer nach g6 zurück."],"sidelines":["Bereite mit c6 den Vorstoß d5 vor.","Greife mit d5 das Zentrum an."]};
const glyph={wk:"♔",wq:"♕",wr:"♖",wb:"♗",wn:"♘",wp:"♙",bk:"♚",bq:"♛",br:"♜",bb:"♝",bn:"♞",bp:"♟"};
function makeCard(v){
 const section=document.createElement("section");section.className="panel";
 section.innerHTML='<h2></h2><div class="boardwrap"><div class="board"></div></div><div class="counter"></div><div class="status" aria-live="polite"></div><div class="notation"></div><div class="actions"><button class="btn" data-action="restart">↺ Neustart</button><button class="btn primary" data-action="next">Zug zeigen →</button></div><details class="tip"><summary>Tipp anzeigen</summary><p class="tiptext"></p></details>';
 section.querySelector("h2").textContent=v.name;
 const board=section.querySelector(".board"),status=section.querySelector(".status"),count=section.querySelector(".counter"),notation=section.querySelector(".notation"),next=section.querySelector('[data-action="next"]'),restart=section.querySelector('[data-action="restart"]');
 let g=new Chess(),ply=0,selected=null,busy=false,version=0;
 const tipBox=section.querySelector(".tip"),tipText=section.querySelector(".tiptext");
 function updateTip(){const blackMoves=v.sequence.slice(0,ply).filter((_,i)=>i%2===1).length;const startBlack=v.id==="sidelines"?0:2;const tipIndex=blackMoves-startBlack;tipText.textContent=ply>=v.sequence.length?"Alle Züge dieser Variante geschafft!":(moveTips[v.id]||[])[tipIndex]||"Entwickle deine Figuren und achte auf das Zentrum.";tipBox.open=false}
 const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
 function render(){
  board.replaceChildren();board.classList.toggle("busy",busy);
  const moves=selected&&!busy?g.moves({square:selected,verbose:true}).map(m=>m.to):[];
  for(let row=0;row<8;row++)for(let col=0;col<8;col++){
   const sq="hgfedcba"[col]+String(row+1),p=g.get(sq),cell=document.createElement("button");cell.type="button";cell.className="sq "+((row+col)%2===0?"light":"dark");cell.dataset.sq=sq;
   if(selected===sq)cell.classList.add("selected");if(moves.includes(sq))cell.classList.add("legal");
   cell.setAttribute("aria-label",sq+(p?" "+p.color+p.type:""));if(p){const span=document.createElement("span");span.className=p.color==="w"?"whitepiece":"blackpiece";span.textContent=glyph[p.color+p.type];cell.append(span)}
   cell.addEventListener("click",()=>tap(sq));board.append(cell)
  }
  count.textContent=ply+" / "+v.sequence.length+" Halbzüge";
  notation.textContent=g.history().map((m,i)=>(i%2===0?(Math.floor(i/2)+1)+". ":"")+m).join(" ");
  next.disabled=busy||ply>=v.sequence.length;restart.disabled=busy;updateTip();
  if(ply>=v.sequence.length){status.textContent="Eröffnung abgeschlossen! ✓";status.className="status done"}
  else{status.className="status";status.textContent=busy?"Figur zieht …":g.turn()==="b"?"Schwarz am Zug.":"Weiß am Zug."}
 }
 function reset(){
  version++;g=new Chess();ply=0;selected=null;busy=false;
  const prefix=["e4","c6","d4","d5"];if(prefix.every((m,i)=>v.sequence[i]===m)){for(const m of prefix)g.move(m);ply=4}
  // Initial white move is already on the board; later white moves are animated.
  if(g.turn()==="w"&&ply<v.sequence.length){g.move(v.sequence[ply]);ply++}
  section.querySelector(".tip").open=false;render()
 }
 async function playMove(san){
  if(busy||ply>=v.sequence.length)return false;
  const trial=new Chess(g.fen()),move=trial.move(san);if(!move)return false;
  busy=true;selected=null;render();
  const from=board.querySelector('[data-sq="'+move.from+'"]'),to=board.querySelector('[data-sq="'+move.to+'"]');
  if(from&&to){
   const source=from.querySelector("span");
   if(source){
    const boardRect=board.getBoundingClientRect(),fr=from.getBoundingClientRect(),tr=to.getBoundingClientRect();
    const flying=document.createElement("span");flying.className="flying-piece "+source.className;flying.textContent=source.textContent;
    flying.style.left=(fr.left-boardRect.left)+"px";flying.style.top=(fr.top-boardRect.top)+"px";
    flying.style.width=fr.width+"px";flying.style.height=fr.height+"px";flying.style.fontSize=getComputedStyle(from).fontSize;
    board.append(flying);source.style.visibility="hidden";
    // Two frames ensure Safari paints the start square before moving.
    await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
    flying.style.transform="translate("+(tr.left-fr.left)+"px,"+(tr.top-fr.top)+"px)";
    await wait(410);
   }
  }
  g.move(san);ply++;busy=false;render();return true
 }
 async function advanceWhite(){
  const token=version;
  while(ply<v.sequence.length&&g.turn()==="w"){
   await wait(450);if(token!==version)return;
   if(!await playMove(v.sequence[ply]))return;
  }
 }
 async function tap(sq){
  if(busy||ply>=v.sequence.length||g.turn()!=="b")return;
  const p=g.get(sq);
  if(selected){
   const possible=g.moves({square:selected,verbose:true}).find(m=>m.to===sq);
   if(possible){
    const trial=new Chess(g.fen()),made=trial.move({from:selected,to:sq,promotion:"q"});
    if(made&&made.san===v.sequence[ply]){await playMove(made.san);advanceWhite();return}
    selected=null;render();status.textContent="Nicht der Zug dieser Variante – versuch es nochmal.";return
   }
  }
  selected=p&&p.color==="b"?sq:null;render()
 }
 restart.addEventListener("click",reset);
 next.addEventListener("click",async()=>{
  if(busy||ply>=v.sequence.length)return;
  const token=version;await playMove(v.sequence[ply]);if(token===version)advanceWhite()
 });
 reset();return section
}
if(typeof Chess==="undefined"){document.getElementById("variations").textContent="Das Schachmodul konnte nicht geladen werden. Bitte Seite neu laden."}
else {
 const list=document.getElementById("variations");
 const cards=variations.map(v=>({v,el:makeCard(v)}));
 cards.forEach(x=>list.append(x.el));
 let lastRandom=-1;
 document.getElementById("randomCard").addEventListener("click",()=>{
  if(!cards.length)return;
  let index=Math.floor(Math.random()*cards.length);
  if(cards.length>1&&index===lastRandom)index=(index+1+Math.floor(Math.random()*(cards.length-1)))%cards.length;
  lastRandom=index;
  const chosen=cards[index];
  const target=document.getElementById("randomTarget");
  target.replaceChildren(chosen.el);
  chosen.el.scrollIntoView({behavior:"smooth",block:"start"});
 });
}
</script></body></html>
